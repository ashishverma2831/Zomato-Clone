<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://cdn.iconscout.com/icon/free/png-256/free-zomato-1937646-1637644.png?f=webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best Restaurants in India - Zomato</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module">
      const apiKey = import.meta.env.VITE_GOOGLE_MAPS_API_KEY

      if (apiKey) {
        const mapsScript = document.createElement('script')
        mapsScript.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}&libraries=places&loading=async`
        mapsScript.async = true
        mapsScript.defer = true
        mapsScript.onerror = () => console.error('Google Maps JavaScript API failed to load.')
        document.head.appendChild(mapsScript)
      } else {
        console.warn('Google Maps API is not configured. Set VITE_GOOGLE_MAPS_API_KEY in frontend/.env.')
      }
    </script>

  </body>
</html>
